<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simo Chop - المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .glass-header { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .transition-smooth { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-24 text-slate-100">

    <header class="glass-header sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center gap-4">
            <div class="flex items-center gap-1 bg-slate-800/80 border border-slate-700/80 rounded-xl p-0.5 shadow-inner">
                <button onclick="changeLanguage('ar')" id="lang-ar" class="px-2 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">العربية</button>
                <button onclick="changeLanguage('fr')" id="lang-fr" class="px-2.5 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">FR</button>
                <button onclick="changeLanguage('en')" id="lang-en" class="px-2.5 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">EN</button>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <h1 class="text-sm font-black tracking-wide text-white" data-i18n="storeTitle">Simo Chop Store</h1>
                </div>
                <img src="logo.png" alt="Simo Chop Logo" class="h-10 w-10 rounded-xl shadow-md object-cover flex-shrink-0 border border-slate-700" onerror="this.src='https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=100';">
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
        
        <!-- قسم عرض المنتجات المختارة -->
        <div class="glass-panel p-5 rounded-3xl">
            <h2 class="text-sm font-extrabold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-umbrella text-indigo-400"></i> <span data-i18n="selectProductsTitle">اختر المظلة والألوان المطلوبة</span>
            </h2>
            <div id="store-products-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>
        </div>

        <!-- نموذج اتمام الطلب للزبون -->
        <div class="glass-panel p-6 rounded-3xl">
            <h2 class="text-sm font-extrabold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping text-emerald-400"></i> <span data-i18n="checkoutTitle">معلومات التوصيل</span>
            </h2>
            <form id="customerOrderForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5" data-i18n="fullName">الاسم الكامل *</label>
                    <input type="text" id="custName" required placeholder="اسم الزبون..."
                        class="w-full px-4 py-3 rounded-xl border border-slate-700 text-xs font-bold bg-slate-900 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5" data-i18n="phoneNumber">رقم الهاتف *</label>
                    <input type="tel" id="custPhone" required placeholder="06XXXXXXXX" dir="ltr"
                        class="w-full px-4 py-3 rounded-xl border border-slate-700 text-xs font-bold bg-slate-900 text-white focus:outline-none text-right">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5" data-i18n="address">العنوان (طنجة) *</label>
                    <textarea id="custAddress" required rows="2" placeholder="الحي، الشارع، رقم المنزل..."
                        class="w-full px-4 py-3 rounded-xl border border-slate-700 text-xs bg-slate-900 text-white focus:outline-none" data-i18n-placeholder="addressPlaceholder"></textarea>
                </div>

                <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 flex justify-between items-center text-xs font-bold">
                    <span data-i18n="totalLabel">المجموع الإجمالي:</span>
                    <span id="storeTotalPrice" class="text-emerald-400 text-base font-black">0 د.م</span>
                </div>

                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl shadow-md transition-smooth active:scale-95 text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-circle"></i> <span data-i18n="confirmOrderBtn">تأكيد وإرسال الطلب</span>
                </button>
            </form>
        </div>
    </main>

    <!-- نافذة نجاح الطلب -->
    <div id="success-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 text-white w-full max-w-sm rounded-3xl p-6 text-center space-y-4 shadow-2xl">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-base font-black" data-i18n="successTitle">تم إرسال طلبك بنجاح!</h3>
            <p class="text-xs text-slate-400" data-i18n="successSub">سيتصل بك فريق الدعم أو البائع لتأكيد طلبك قريباً.</p>
            <button onclick="closeSuccessModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-xs transition-smooth" data-i18n="okBtn">حسناً</button>
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                storeTitle: "متجر Simo Chop",
                selectProductsTitle: "اختر المظلة والألوان المطلوبة",
                checkoutTitle: "معلومات التوصيل",
                fullName: "الاسم الكامل *",
                phoneNumber: "رقم الهاتف *",
                address: "العنوان (طنجة) *",
                addressPlaceholder: "الحي، الشارع، رقم المنزل...",
                totalLabel: "المجموع الإجمالي:",
                confirmOrderBtn: "تأكيد وإرسال الطلب",
                successTitle: "تم إرسال طلبك بنجاح!",
                successSub: "سيتصل بك فريق الدعم أو البائع لتأكيد طلبك قريباً.",
                okBtn: "حسناً",
                currency: "د.م",
                units: "قطعة"
            },
            fr: {
                storeTitle: "Boutique Simo Chop",
                selectProductsTitle: "Choisissez le parasol et les couleurs",
                checkoutTitle: "Informations de livraison",
                fullName: "Nom complet *",
                phoneNumber: "Téléphone *",
                address: "Adresse (Tanger) *",
                addressPlaceholder: "Quartier, rue, numéro de maison...",
                totalLabel: "Total général:",
                confirmOrderBtn: "Confirmer la commande",
                successTitle: "Commande envoyée avec succès !",
                successSub: "Le vendeur vouscontactera bientôt.",
                okBtn: "OK",
                currency: "DH",
                units: "unités"
            },
            en: {
                storeTitle: "Simo Chop Store",
                selectProductsTitle: "Choose your umbrella & colors",
                checkoutTitle: "Delivery Information",
                fullName: "Full Name *",
                phoneNumber: "Phone Number *",
                address: "Address (Tangier) *",
                addressPlaceholder: "Neighborhood, street, house number...",
                totalLabel: "Grand Total:",
                confirmOrderBtn: "Confirm Order",
                successTitle: "Order sent successfully!",
                successSub: "The seller will contact you soon.",
                okBtn: "OK",
                currency: "DH",
                units: "units"
            }
        };

        let currentLang = localStorage.getItem('APP_LANG') || 'ar';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('APP_LANG', lang);
            const htmlRoot = document.getElementById('htmlRoot');
            htmlRoot.setAttribute('lang', lang);
            htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            ['ar', 'fr', 'en'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (btn) {
                    btn.className = l === lang ? "px-2 py-0.5 text-[10px] font-bold rounded-lg transition-smooth bg-indigo-600 text-white shadow-xs" : "px-2.5 py-0.5 text-[10px] font-bold rounded-lg transition-smooth text-slate-400 hover:text-white";
                }
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });

            renderStoreProducts();
        }

        const SUPABASE_URL = "https://odrqwpcwcdfftjxatkyx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcnF3cGN3Y2RmZnRqeGF0a3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.Fvjz335UThZ0OfnwpdKCoO2Zg_WQA8jinFJnGV4CrB0";

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const DEFAULT_COLORS = [
            { id: 'beige', name: 'مظلة باللون البيج', stock: 100, price: 130, img: 'beige.jpg' },
            { id: 'blue', name: 'مظلة باللون الأزرق', stock: 95, price: 130, img: 'blue.jpg' },
            { id: 'green', name: 'مظلة باللون الأخضر', stock: 90, price: 130, img: 'green.jpg' },
            { id: 'gray', name: 'مظلة باللون الرمادي', stock: 85, price: 130, img: 'gray.jpg' },
            { id: 'pink', name: 'مظلة باللون الوردي', stock: 80, price: 130, img: 'pink.jpg' },
            { id: 'black', name: 'مظلة باللون الأسود', stock: 110, price: 130, img: 'black.jpg' }
        ];

        let colors = JSON.parse(JSON.stringify(DEFAULT_COLORS));
        let orders = [];
        let courierDebt = 0;

        async function loadStoreData() {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    orders = data.payload.orders || [];
                    colors = data.payload.colors || DEFAULT_COLORS;
                    courierDebt = data.payload.courierDebt || 0;
                }
            } catch (e) {}
            renderStoreProducts();
        }

        async function saveStoreData() {
            const payload = { orders, colors, courierDebt };
            await sb.from('app_state').upsert({ id: 'simo_store_data', payload });
        }

        loadStoreData();
        changeLanguage(currentLang);

        function renderStoreProducts() {
            const list = document.getElementById('store-products-list');
            if (!list) return;

            list.innerHTML = colors.map((item, index) => `
                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 flex items-center justify-between gap-3 text-xs">
                    <div class="flex items-center gap-3">
                        <img src="${item.img}" onerror="this.src='https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=200';" class="w-12 h-12 rounded-xl object-cover border border-slate-700 flex-shrink-0" alt="صورة المظلة">
                        <div>
                            <div class="font-extrabold text-white text-xs">${item.name}</div>
                            <div class="text-[11px] text-indigo-400 font-bold mt-0.5">${item.price} ${translations[currentLang].currency}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" min="0" value="0" id="qty-${item.id}" oninput="calculateStoreTotal()" 
                            class="w-14 px-2 py-2 rounded-xl border border-slate-700 bg-slate-950 text-white font-black text-center focus:outline-none">
                    </div>
                </div>
            `).join('');
            calculateStoreTotal();
        }

        function calculateStoreTotal() {
            let total = 0;
            colors.forEach(item => {
                const input = document.getElementById(`qty-${item.id}`);
                if (input) {
                    const q = parseInt(input.value) || 0;
                    total += q * (item.price || 130);
                }
            });
            document.getElementById('storeTotalPrice').textContent = total + ' ' + translations[currentLang].currency;
        }

        const customerOrderForm = document.getElementById('customerOrderForm');
        if (customerOrderForm) {
            customerOrderForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                let selectedItems = [];
                let totalAmount = 0;

                colors.forEach(item => {
                    const input = document.getElementById(`qty-${item.id}`);
                    if (input) {
                        const q = parseInt(input.value) || 0;
                        if (q > 0) {
                            selectedItems.push({ productId: item.id, qty: q });
                            totalAmount += q * (item.price || 130);
                        }
                    }
                });

                if (selectedItems.length === 0) {
                    alert('المرجو اختيار منتج واحد على الأقل');
                    return;
                }

                let summaryParts = selectedItems.map(i => {
                    const prod = colors.find(c => c.id === i.productId);
                    return `${prod ? prod.name : ''} (العدد: ${i.qty})`;
                });

                const newOrder = {
                    id: 'ORD_' + Date.now(),
                    productName: summaryParts.join(' + '),
                    items: selectedItems,
                    quantity: selectedItems.reduce((sum, i) => sum + i.qty, 0),
                    clientName: document.getElementById('custName').value.trim(),
                    phone: document.getElementById('custPhone').value.trim(),
                    address: document.getElementById('custAddress').value.trim(),
                    price: totalAmount,
                    deliveryFee: 20,
                    // حالة الطلب معلقة عند البائع أولاً ولا تذهب للفرور حتى يؤكدها البائع
                    status: 'pending_seller', 
                    createdAt: Date.now()
                };

                orders.unshift(newOrder);
                await saveStoreData();

                document.getElementById('success-modal').classList.remove('hidden');
                customerOrderForm.reset();
                renderStoreProducts();
            });
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
