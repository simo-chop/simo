<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simo Chop - Page Livreur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; }
        .card-bg { background: #111827; border: 1px solid rgba(255, 255, 255, 0.07); }
        .header-bg { background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .transition-smooth { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-20 text-slate-100">

    <!-- الهيدر العلوي المطابق للتصميم الأصلي -->
    <header class="header-bg sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 pt-3.5 pb-3 flex justify-between items-center gap-2" dir="ltr">
            <!-- أزرار اللغات -->
            <div class="flex items-center bg-slate-800/90 border border-slate-700/80 rounded-full p-1">
                <button onclick="changeLanguage('ar')" id="lang-ar" class="px-3 py-1 text-[11px] font-bold rounded-full transition-smooth text-slate-300">AR</button>
                <button onclick="changeLanguage('fr')" id="lang-fr" class="px-3 py-1 text-[11px] font-bold rounded-full transition-smooth bg-indigo-600 text-white">FR</button>
                <button onclick="changeLanguage('en')" id="lang-en" class="px-3 py-1 text-[11px] font-bold rounded-full transition-smooth text-slate-300">EN</button>
            </div>

            <!-- زر الخروج واسم اللفرور والأيقونة -->
            <div class="flex items-center gap-3">
                <button onclick="logoutCourier()" class="w-9 h-9 rounded-full bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 border border-rose-500/30 flex items-center justify-center text-xs transition-smooth" title="Logout">
                    <i class="fa-solid fa-power-off"></i>
                </button>
                <h1 class="text-sm font-black text-white tracking-wide">
                    <span data-i18n="pageTitle">Page Livreur:</span> <span id="courierDisplayName">سيمو</span>
                </h1>
                <div class="w-10 h-10 rounded-2xl bg-emerald-950/80 border border-emerald-800/50 flex items-center justify-center text-lg shadow-md">
                    🛵
                </div>
            </div>
        </div>

        <!-- شارة عدد الطلبات قيد الانتظار -->
        <div class="max-w-xl mx-auto px-4 py-2.5 border-t border-slate-800/80 flex items-center" dir="ltr">
            <div class="bg-amber-500 text-slate-950 font-black text-xs px-4 py-1.5 rounded-full shadow-md inline-flex items-center gap-1.5">
                <span id="pendingCountBadge">0</span>
                <span data-i18n="pendingBadge">En attente</span>
            </div>
        </div>
    </header>

    <!-- قائمة الطلبات -->
    <main class="max-w-xl mx-auto px-4 mt-4 space-y-4" id="courierOrdersList"></main>

    <!-- نافذة سبب الرفض (Refusé) -->
    <div id="refuse-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 text-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
            <h3 class="text-sm font-black text-rose-400" data-i18n="refuseModalTitle">سبب رفض الطلب</h3>
            <input type="hidden" id="refuseOrderId">
            <textarea id="refuseReasonInput" rows="3" placeholder="اكتب سبب الرفض (اختياري)..." class="w-full p-3.5 rounded-2xl bg-slate-950 border border-slate-700 text-xs text-white focus:outline-none"></textarea>
            <div class="flex gap-2">
                <button onclick="confirmRefused()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-black py-3 rounded-2xl text-xs transition-smooth" data-i18n="confirmBtn">تأكيد</button>
                <button onclick="closeRefuseModal()" class="px-5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-2xl text-xs transition-smooth" data-i18n="cancelBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة جدولة الطلب (Planifié) -->
    <div id="schedule-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 text-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
            <h3 class="text-sm font-black text-sky-400" data-i18n="scheduleModalTitle">جدولة موعد التوصيل</h3>
            <input type="hidden" id="scheduleOrderId">
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 font-bold mb-1" data-i18n="dateLabel">التاريخ:</label>
                    <input type="date" id="scheduleDateInput" class="w-full p-3 rounded-2xl bg-slate-950 border border-slate-700 text-white font-bold">
                </div>
                <div>
                    <label class="block text-slate-400 font-bold mb-1" data-i18n="timeLabel">الوقت:</label>
                    <input type="time" id="scheduleTimeInput" class="w-full p-3 rounded-2xl bg-slate-950 border border-slate-700 text-white font-bold">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="confirmScheduled()" class="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-2xl text-xs transition-smooth" data-i18n="confirmBtn">تأكيد</button>
                <button onclick="closeScheduleModal()" class="px-5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-2xl text-xs transition-smooth" data-i18n="cancelBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== إعدادات الإشعارات الصامتة NTFY ====================
        const NTFY_ADMIN_TOPIC = 'simo_chop_admin_9988'; // نفس القناة المشترك بها في هاتفك

        function notifyAdminSilently(message, tags = 'motorcycle', priority = 'urgent') {
            fetch(`https://ntfy.sh/${NTFY_ADMIN_TOPIC}`, {
                method: 'POST',
                body: message,
                headers: {
                    'Title': 'Simo-Chop Livreur',
                    'Priority': priority,
                    'Tags': tags
                }
            }).catch(() => {}); // صامت تماماً بدون أي أخطاء في المتصفح
        }
        // =========================================================================

        const translations = {
            ar: {
                pageTitle: "صفحة اللفرور:",
                pendingBadge: "قيد الانتظار",
                qtyLabel: "الكمية:",
                currency: "د.م",
                whatsappClient: "واتساب الزبون",
                btnDelivered: "تم الإستلام",
                btnRefused: "رفض",
                btnScheduled: "مجدول",
                noOrders: "لا توجد طلبات قيد الانتظار حالياً",
                refuseModalTitle: "سبب رفض الاستلام",
                scheduleModalTitle: "جدولة موعد التوصيل",
                dateLabel: "التاريخ:",
                timeLabel: "الوقت:",
                confirmBtn: "تأكيد",
                cancelBtn: "إلغاء"
            },
            fr: {
                pageTitle: "Page Livreur:",
                pendingBadge: "En attente",
                qtyLabel: "Qté:",
                currency: "DH",
                whatsappClient: "WhatsApp Client",
                btnDelivered: "Livré",
                btnRefused: "Refusé",
                btnScheduled: "Planifié",
                noOrders: "Aucune commande en attente",
                refuseModalTitle: "Motif du refus",
                scheduleModalTitle: "Planifier la livraison",
                dateLabel: "Date:",
                timeLabel: "Heure:",
                confirmBtn: "Confirmer",
                cancelBtn: "Annuler"
            },
            en: {
                pageTitle: "Courier Page:",
                pendingBadge: "Pending",
                qtyLabel: "Qty:",
                currency: "DH",
                whatsappClient: "WhatsApp Client",
                btnDelivered: "Delivered",
                btnRefused: "Refused",
                btnScheduled: "Scheduled",
                noOrders: "No pending orders currently",
                refuseModalTitle: "Reason for refusal",
                scheduleModalTitle: "Schedule Delivery",
                dateLabel: "Date:",
                timeLabel: "Time:",
                confirmBtn: "Confirm",
                cancelBtn: "Cancel"
            }
        };

        // تحديد ما إذا كانت الصفحة هي liv.html (لفرور 2) أو livreur.html (لفرور 1)
        const isLiv2 = window.location.pathname.includes('liv.html');
        const defaultCourierName = isLiv2 ? 'لفرور 2 (liv)' : (localStorage.getItem('COURIER_NAME') || 'لفرور 1 (سيمو)');
        document.getElementById('courierDisplayName').textContent = defaultCourierName;

        let currentLang = localStorage.getItem('COURIER_LANG') || 'fr';

        function logoutCourier() {
            localStorage.removeItem('COURIER_LOGGED_IN');
            window.location.href = 'login-livreur.html';
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('COURIER_LANG', lang);
            ['ar', 'fr', 'en'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (btn) {
                    btn.className = l === lang
                        ? "px-3 py-1 text-[11px] font-bold rounded-full transition-smooth bg-indigo-600 text-white shadow-sm"
                        : "px-3 py-1 text-[11px] font-bold rounded-full transition-smooth text-slate-300 hover:text-white";
                }
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });

            renderCourierOrders();
        }

        const SUPABASE_URL = "https://odrqwpcwcdfftjxatkyx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcnF3cGN3Y2RmZnRqeGF0a3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.Fvjz335UThZ0OfnwpdKCoO2Zg_WQA8jinFJnGV4CrB0";

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let orders = [];
        let colors = [];

        async function loadCourierData() {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    orders = data.payload.orders || [];
                    colors = data.payload.colors || [];
                }
            } catch (e) {}
            renderCourierOrders();
        }

        async function saveCourierData() {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                let currentPayload = data && data.payload ? data.payload : {};
                currentPayload.orders = orders;
                if (colors.length > 0) currentPayload.colors = colors;
                await sb.from('app_state').upsert({ id: 'simo_store_data', payload: currentPayload });
            } catch (e) {}
        }

        sb.channel('public:app_state_courier_realtime')
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state', filter: 'id=eq.simo_store_data' }, payload => {
              if (payload.new && payload.new.payload) {
                  orders = payload.new.payload.orders || [];
                  colors = payload.new.payload.colors || [];
                  renderCourierOrders();
              }
          })
          .subscribe();

        function formatWhatsAppPhone(phone) {
            if (!phone) return '';
            let p = phone.replace(/\D/g, '');
            if (p.startsWith('0')) {
                p = '212' + p.substring(1);
            }
            return p;
        }

        function filterOrdersForThisPage(ordersList) {
            return ordersList.filter(o => {
                if (o.status !== 'pending' && o.status !== 'scheduled') return false;
                if (isLiv2) {
                    return o.courierAssigned && (o.courierAssigned.includes('2') || o.courierAssigned.includes('(liv)'));
                } else {
                    return !o.courierAssigned || !o.courierAssigned.includes('2');
                }
            });
        }

        function renderCourierOrders() {
            const container = document.getElementById('courierOrdersList');
            const badge = document.getElementById('pendingCountBadge');
            if (!container) return;

            const activeOrders = filterOrdersForThisPage(orders);
            if (badge) badge.textContent = activeOrders.length;

            if (activeOrders.length === 0) {
                container.innerHTML = `<div class="card-bg rounded-3xl text-center py-14 text-slate-400 text-xs font-bold">${translations[currentLang].noOrders}</div>`;
                return;
            }

            const t = translations[currentLang];

            container.innerHTML = activeOrders.map(order => `
                <div class="card-bg rounded-3xl p-5 shadow-xl space-y-4" dir="ltr">
                    <!-- السطر العلوي: اسم المنتج والكمية والسعر -->
                    <div class="flex justify-between items-start gap-3">
                        <div class="space-y-1.5">
                            <div class="inline-flex items-center gap-1.5 bg-amber-950/60 border border-amber-700/40 text-amber-300 font-extrabold text-xs px-3.5 py-1.5 rounded-full">
                                <span>📦</span>
                                <span dir="auto">${order.productName}</span>
                            </div>
                            <div>
                                <span class="inline-block bg-slate-800/90 text-indigo-300 font-extrabold text-[11px] px-2.5 py-0.5 rounded-lg">
                                    ${t.qtyLabel} ${order.quantity || 1}
                                </span>
                                ${order.status === 'scheduled' ? `<span class="inline-block bg-sky-900/60 text-sky-300 font-bold text-[10px] px-2 py-0.5 rounded-lg ml-1">📅 ${order.scheduledDate || ''} ${order.scheduledTime || ''}</span>` : ''}
                            </div>
                        </div>

                        <div class="bg-teal-950/50 border border-teal-800/40 text-emerald-400 font-black px-3.5 py-2 rounded-2xl text-xs text-center leading-snug flex-shrink-0">
                            <div>${order.price}</div>
                            <div>${t.currency}</div>
                        </div>
                    </div>

                    <!-- العنوان -->
                    <div class="font-extrabold text-white text-sm flex items-center gap-1.5 pt-1">
                        <span>📍</span>
                        <span dir="auto">${order.address}</span>
                    </div>

                    <!-- أزرار الاتصال وواتساب الزبون -->
                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <a href="tel:${order.phone}" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-extrabold py-3.5 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg transition-smooth">
                            <span>📞</span>
                            <span>${order.phone}</span>
                        </a>
                        <a href="https://wa.me/${formatWhatsAppPhone(order.phone)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-extrabold py-3.5 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg transition-smooth">
                            <i class="fa-brands fa-whatsapp text-base"></i>
                            <span>${t.whatsappClient}</span>
                        </a>
                    </div>

                    <!-- أزرار حالة الطلب: Livré / Refusé / Planifié -->
                    <div class="grid grid-cols-3 gap-2.5 pt-1">
                        <button onclick="markDelivered('${order.id}')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-extrabold py-3 rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow-md transition-smooth">
                            <span>✅</span>
                            <span>${t.btnDelivered}</span>
                        </button>
                        <button onclick="openRefuseModal('${order.id}')" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-extrabold py-3 rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow-md transition-smooth">
                            <span>✖</span>
                            <span>${t.btnRefused}</span>
                        </button>
                        <button onclick="openScheduleModal('${order.id}')" class="bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-extrabold py-3 rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow-md transition-smooth">
                            <span>📅</span>
                            <span>${t.btnScheduled}</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function markDelivered(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            order.status = 'delivered';
            order.deliveredAt = Date.now();
            order.courierName = defaultCourierName;

            // خصم الكمية من المخزون عند التسليم
            if (order.items && Array.isArray(order.items)) {
                order.items.forEach(item => {
                    const prod = colors.find(c => c.id === item.productId);
                    if (prod) prod.stock = Math.max(0, (prod.stock || 0) - (item.qty || 1));
                });
            }

            // إرسال إشعار فوري وصامت لهاتفك عبر ntfy
            notifyAdminSilently(
                `✅ تم تسليم طلب بنجاح!\n👤 بواسطة: ${defaultCourierName}\n📦 المنتج: ${order.productName}\n💰 المبلغ: ${order.price} د.م\n📍 العنوان: ${order.address}\n📞 الزبون: ${order.phone}`,
                'white_check_mark,moneybag',
                'urgent'
            );

            renderCourierOrders();
            await saveCourierData();
        }

        function openRefuseModal(orderId) {
            document.getElementById('refuseOrderId').value = orderId;
            document.getElementById('refuseReasonInput').value = '';
            document.getElementById('refuse-modal').classList.remove('hidden');
        }

        function closeRefuseModal() {
            document.getElementById('refuse-modal').classList.add('hidden');
        }

        async function confirmRefused() {
            const orderId = document.getElementById('refuseOrderId').value;
            const reason = document.getElementById('refuseReasonInput').value.trim();
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'refused';
                order.refusalReason = reason;
                order.deliveredAt = Date.now();
                order.courierName = defaultCourierName;

                // إرسال إشعار فوري وصامت لهاتفك عند الرفض
                notifyAdminSilently(
                    `❌ تم رفض استلام طلب!\n👤 اللفرور: ${defaultCourierName}\n📦 المنتج: ${order.productName}\n❓ السبب: ${reason || 'غير محدد'}\n📍 العنوان: ${order.address}\n📞 الزبون: ${order.phone}`,
                    'x,warning',
                    'urgent'
                );

                closeRefuseModal();
                renderCourierOrders();
                await saveCourierData();
            }
        }

        function openScheduleModal(orderId) {
            document.getElementById('scheduleOrderId').value = orderId;
            document.getElementById('scheduleDateInput').value = new Date().toISOString().split('T')[0];
            document.getElementById('scheduleTimeInput').value = '14:00';
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function closeScheduleModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        async function confirmScheduled() {
            const orderId = document.getElementById('scheduleOrderId').value;
            const sDate = document.getElementById('scheduleDateInput').value;
            const sTime = document.getElementById('scheduleTimeInput').value;
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'scheduled';
                order.scheduledDate = sDate;
                order.scheduledTime = sTime;
                order.courierName = defaultCourierName;

                // إرسال إشعار فوري وصامت لهاتفك عند الجدولة
                notifyAdminSilently(
                    `📅 تمت جدولة طلب لموعد آخر!\n👤 اللفرور: ${defaultCourierName}\n📦 المنتج: ${order.productName}\n⏰ الموعد: ${sDate} الساعة ${sTime}\n📍 العنوان: ${order.address}\n📞 الزبون: ${order.phone}`,
                    'calendar,clock3',
                    'high'
                );

                closeScheduleModal();
                renderCourierOrders();
                await saveCourierData();
            }
        }

        changeLanguage(currentLang);
        loadCourierData();
    </script>
</body>
</html>
