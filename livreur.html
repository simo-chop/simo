<!DOCTYPE html>
<html lang="ar" dir="rtl" id="courierHtmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simo Chop - Livreur Portal</title>
    <script>
        if (localStorage.getItem('COURIER_LOGGED_IN') !== 'true') {
            window.location.href = 'login-livreur.html';
        } 
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f1f5f9; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .transition-smooth { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-xl mx-auto px-4 py-3.5 flex justify-between items-center gap-4">
            
            <!-- أزرار اللغات في اليمين -->
            <div class="flex items-center gap-1 bg-slate-800/80 border border-slate-700/80 rounded-xl p-0.5 shadow-inner">
                <button onclick="changeLang('ar')" id="btn-ar" class="px-2 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">AR</button>
                <button onclick="changeLang('fr')" id="btn-fr" class="px-2.5 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">FR</button>
                <button onclick="changeLang('en')" id="btn-en" class="px-2.5 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">EN</button>
            </div>

            <!-- العنوان وزر الخروج في اليسار -->
            <div class="flex items-center gap-3">
                <button onclick="logout()" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-xs font-bold px-2.5 py-1.5 rounded-xl border border-rose-900/50 transition-smooth" title="تسجيل الخروج">
                    <i class="fa-solid fa-power-off"></i>
                </button>
                <div class="text-left">
                    <h1 class="text-sm font-black text-white tracking-wide" id="courierTitle">صفحة اللفرور</h1>
                </div>
                <div class="bg-emerald-500/20 text-emerald-400 w-10 h-10 rounded-2xl flex items-center justify-center text-lg shadow-inner flex-shrink-0">
                    🛵
                </div>
            </div>
        </div>

        <div class="max-w-xl mx-auto px-4 pb-3 flex justify-between items-center gap-3 border-t border-slate-800/60 pt-2.5">
            <span class="bg-amber-400 text-slate-950 font-black text-xs px-3 py-1.5 rounded-xl shadow-sm whitespace-nowrap" id="pendingBadge">0 قيد الانتظار</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6">
        <div id="ordersContainer" class="space-y-4"></div>
    </main>

    <script>
        function logout() {
            localStorage.removeItem('COURIER_LOGGED_IN');
            localStorage.removeItem('COURIER_USERNAME');
            window.location.href = 'login-livreur.html';
        }

        const texts = {
            ar: { title: "صفحة اللفرور", pending: "قيد الانتظار", noOrders: "لا توجد طلبات قيد الانتظار حالياً", whatsapp: "واتساب المستلم", delivered: "✅ تم الإستلام", refused: "❌ رفض", schedule: "📅 جدولة", confirmRefusal: "تأكيد الرفض", confirmSchedule: "تأكيد الجدولة", cancel: "إلغاء", reasonAlert: "أدخل السبب", currency: "د.م", qty: "العدد", reasons: ["الهاتف مغلق 📴", "الزبون رفض الطلب ❌", "العنوان غير واضح 📍", "غير متواجد حالياً ⏳"] },
            fr: { title: "Page Livreur", pending: "En attente", noOrders: "Aucune commande en attente", whatsapp: "WhatsApp Client", delivered: "✅ Livré", refused: "❌ Refusé", schedule: "📅 Planifié", confirmRefusal: "Confirmer le refus", confirmSchedule: "Confirmer", cancel: "Annuler", reasonAlert: "Entrez le motif", currency: "DH", qty: "Qté", reasons: ["Téléphone éteint 📴", "Client a refusé ❌", "Adresse floue 📍", "Absent ⏳"] },
            en: { title: "Courier Page", pending: "Pending", noOrders: "No pending orders", whatsapp: "Client WhatsApp", delivered: "✅ Delivered", refused: "❌ Refused", schedule: "📅 Schedule", confirmRefusal: "Confirm Refusal", confirmSchedule: "Confirm", cancel: "Cancel", reasonAlert: "Enter reason", currency: "DH", qty: "Qty", reasons: ["Phone off 📴", "Customer refused ❌", "Unclear address 📍", "Not available ⏳"] }
        };

        let currentLang = localStorage.getItem('COURIER_LANG') || 'ar';

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('COURIER_LANG', lang);
            document.getElementById('courierHtmlRoot').setAttribute('lang', lang);
            document.getElementById('courierHtmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            ['ar', 'fr', 'en'].forEach(l => {
                const b = document.getElementById(`btn-${l}`);
                if (b) b.className = l === lang ? "px-2.5 py-0.5 text-[10px] font-bold rounded-lg bg-indigo-600 text-white shadow-xs" : "px-2.5 py-0.5 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white";
            });

            const username = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
            document.getElementById('courierTitle').textContent = `${texts[currentLang].title}: ${username}`;
            renderOrders();
        }

        const SUPABASE_URL = "https://odrqwpcwcdfftjxatkyx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcnF3cGN3Y2RmZnRqeGF0a3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.Fvjz335UThZ0OfnwpdKCoO2Zg_WQA8jinFJnGV4CrB0";

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let orders = [];
        let activeId = null;

        async function loadData() {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    orders = data.payload.orders || [];
                    if (!activeId) renderOrders();
                }
            } catch (e) {}
        }

        async function saveData(updatedOrders, colors, courierDebt) {
            await sb.from('app_state').upsert({ id: 'simo_store_data', payload: { orders: updatedOrders, colors, courierDebt } });
        }

        async function markDelivered(id) {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    orders = data.payload.orders || [];
                    let colors = data.payload.colors || [];
                    let courierDebt = data.payload.courierDebt || 0;

                    const idx = orders.findIndex(o => o.id === id);
                    if (idx === -1) return;

                    const username = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
                    const order = orders[idx];
                    order.status = 'delivered';
                    order.deliveredAt = Date.now();
                    order.courierName = username;
                    const qty = order.quantity || 1;

                    let prod = colors.find(c => c.id === order.productId);
                    if (prod) prod.stock = Math.max(0, prod.stock - qty);

                    await saveData(orders, colors, courierDebt);
                    activeId = null;
                    renderOrders();

                    const waMsg = `✅ تم استلام الطلب بنجاح بواسطة (${username}) \n📦 المنتج: ${order.productName} (العدد: ${qty}) \n📍 العنوان: ${order.address} \n💰 الثمن: ${order.price} د.م`;
                    window.open(`https://wa.me/212660005716?text=${encodeURIComponent(waMsg)}`, '_blank');
                }
            } catch (e) {}
        }

        function getWaUrl(phone, name, qty, price, address) {
            let clean = phone.replace(/[^0-9+]/g, '');
            if (clean.startsWith('06') || clean.startsWith('07')) clean = '212' + clean.substring(1);
            else if (clean.startsWith('+')) clean = clean.substring(1);
            const username = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
            const msg = `👋 السلام عليكم 👋\n\n🛵 معكم : *${username}* اللفرور\n📦 كنتواصل معكم بخصوص الطلب ديالكم: *${name}* (العدد: ${qty})\n💵 المبلغ المستحق : *${price}* درهم\n📌 المرجو تأكيد عنوانكم : *${address}*`;
            return `https://wa.me/${clean}?text=${encodeURIComponent(msg)}`;
        }

        function toggleBox(id, type) {
            activeId = id;
            document.querySelectorAll('[id^="box-"]').forEach(el => el.classList.add('hidden'));
            const box = document.getElementById(`${type}-box-${id}`);
            if (box) box.classList.remove('hidden');
        }

        function closeBox(id) {
            activeId = null;
            document.querySelectorAll('[id^="box-"]').forEach(el => el.classList.add('hidden'));
        }

        function setReason(id, text) {
            document.getElementById(`reason-input-${id}`).value = text;
        }

        async function confirmRefusal(id) {
            const reason = document.getElementById(`reason-input-${id}`).value.trim();
            if (!reason) return alert(texts[currentLang].reasonAlert);

            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    orders = data.payload.orders || [];
                    const username = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
                    const idx = orders.findIndex(o => o.id === id);
                    if (idx !== -1) {
                        orders[idx].status = 'refused';
                        orders[idx].refusalReason = reason;
                        orders[idx].deliveredAt = Date.now();
                        orders[idx].courierName = username;
                    }
                    await saveData(orders, data.payload.colors || [], data.payload.courierDebt || 0);
                    activeId = null;
                    renderOrders();
                }
            } catch (e) {}
        }

        async function confirmSchedule(id) {
            const d = document.getElementById(`sched-date-${id}`).value;
            const t = document.getElementById(`sched-time-${id}`).value;
            if (!d || !t) return alert('حدد التاريخ والوقت');

            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    orders = data.payload.orders || [];
                    const username = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
                    const idx = orders.findIndex(o => o.id === id);
                    if (idx !== -1) {
                        orders[idx].status = 'scheduled';
                        orders[idx].scheduledDate = d;
                        orders[idx].scheduledTime = t;
                        orders[idx].courierName = username;
                    }
                    await saveData(orders, data.payload.colors || [], data.payload.courierDebt || 0);
                    activeId = null;
                    renderOrders();
                }
            } catch (e) {}
        }

        function renderOrders() {
            const pending = orders.filter(o => o.status === 'pending');
            const t = texts[currentLang];
            document.getElementById('pendingBadge').textContent = `${pending.length} ${t.pending}`;
            const container = document.getElementById('ordersContainer');

            if (pending.length === 0) {
                container.innerHTML = `<div class="glass-card p-12 text-center rounded-3xl text-slate-400 text-xs">${t.noOrders}</div>`;
                return;
            }

            container.innerHTML = pending.map(o => {
                const qty = o.quantity || 1;
                return `
                <div class="glass-card rounded-3xl p-5 shadow-xl text-white">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="text-xs bg-amber-500/20 text-amber-300 font-bold px-3 py-1 rounded-xl">📦 ${o.productName}</span>
                            <span class="text-xs bg-indigo-500/20 text-indigo-300 font-bold px-2.5 py-1 rounded-xl">${t.qty}: ${qty}</span>
                        </div>
                        <span class="font-black text-emerald-400 text-sm bg-emerald-500/10 px-3 py-1 rounded-xl">${o.price} ${t.currency}</span>
                    </div>
                    <p class="text-sm mb-4 font-bold text-slate-200">📍 ${o.address}</p>
                    <div class="grid grid-cols-2 gap-2.5 mb-3">
                        <a href="tel:${o.phone}" class="bg-blue-600 hover:bg-blue-700 text-center py-3 rounded-2xl font-extrabold text-xs shadow-sm flex items-center justify-center gap-1.5">📞 ${o.phone}</a>
                        <a href="${getWaUrl(o.phone, o.productName, qty, o.price, o.address)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-center py-3 rounded-2xl font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-sm">
                            <i class="fa-brands fa-whatsapp text-sm"></i> ${t.whatsapp}
                        </a>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="markDelivered('${o.id}')" class="bg-emerald-600 hover:bg-emerald-700 py-3 rounded-2xl font-extrabold text-xs shadow-sm">${t.delivered}</button>
                        <button onclick="toggleBox('${o.id}', 'refusal')" class="bg-rose-600 hover:bg-rose-700 py-3 rounded-2xl font-extrabold text-xs shadow-sm">${t.refused}</button>
                        <button onclick="toggleBox('${o.id}', 'schedule')" class="bg-sky-600 hover:bg-sky-700 py-3 rounded-2xl font-extrabold text-xs shadow-sm">${t.schedule}</button>
                    </div>

                    <div id="refusal-box-${o.id}" class="hidden mt-4 pt-3 border-t border-slate-800">
                        <div class="flex flex-wrap gap-1.5 mb-2.5">
                            ${t.reasons.map(r => `<button onclick="setReason('${o.id}', '${r}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-semibold px-2.5 py-1.5 rounded-xl border border-slate-700">${r}</button>`).join('')}
                        </div>
                        <input type="text" id="reason-input-${o.id}" placeholder="..." class="w-full px-3.5 py-3 bg-slate-900 border border-slate-700 rounded-2xl text-xs mb-2.5 text-white">
                        <div class="flex gap-2">
                            <button onclick="confirmRefusal('${o.id}')" class="flex-1 bg-rose-600 hover:bg-rose-700 py-2.5 rounded-2xl text-xs font-bold">${t.confirmRefusal}</button>
                            <button onclick="closeBox('${o.id}')" class="px-4 bg-slate-800 hover:bg-slate-700 rounded-2xl text-xs">${t.cancel}</button>
                        </div>
                    </div>

                    <div id="schedule-box-${o.id}" class="hidden mt-3 pt-3 border-t border-slate-800 text-xs">
                        <div class="grid grid-cols-2 gap-2 mb-2.5">
                            <input type="date" id="sched-date-${o.id}" class="bg-slate-900 p-3 rounded-2xl border border-slate-700 text-white">
                            <input type="time" id="sched-time-${o.id}" class="bg-slate-900 p-3 rounded-2xl border border-slate-700 text-white">
                        </div>
                        <div class="flex gap-2">
                            <button onclick="confirmSchedule('${o.id}')" class="flex-1 bg-sky-600 hover:bg-sky-700 py-2.5 rounded-2xl font-bold">${t.confirmSchedule}</button>
                            <button onclick="closeBox('${o.id}')" class="px-4 bg-slate-800 hover:bg-slate-700 rounded-2xl">${t.cancel}</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        changeLang(currentLang);
        loadData();
        setInterval(loadData, 1500);
    </script>
</body>
</html>
