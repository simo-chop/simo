<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simo Chop - صفحة اللفرور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .glass-header { background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .transition-smooth { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-24 text-slate-100">

    <header class="glass-header sticky top-0 z-50 shadow-lg">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
                <h1 id="pageTitle" class="text-sm font-black tracking-wide text-white">لوحة تتبع التوصيل</h1>
            </div>
            <img src="logo.png" alt="Logo" class="h-10 w-10 rounded-xl object-cover border border-slate-700" onerror="this.src='https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=100';">
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">
        <div class="glass-panel p-5 rounded-3xl border border-indigo-500/30 flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-400 font-bold">مصاريف التوصيل المحصلة اليوم</p>
                <p id="courierDailyEarn" class="text-xl font-black text-emerald-400 mt-1">0 د.م</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
        </div>

        <div class="bg-slate-800/60 p-1.5 rounded-2xl flex gap-2">
            <button onclick="switchCourierTab('active')" id="ctab-active" class="flex-1 py-3 rounded-xl font-extrabold text-xs bg-indigo-600 text-white transition-smooth shadow-sm">
                الطلبات المتاحة لتوصيلك
            </button>
            <button onclick="switchCourierTab('history')" id="ctab-history" class="flex-1 py-3 rounded-xl font-extrabold text-xs bg-transparent text-slate-400 hover:text-white transition-smooth">
                سجل التوصيل
            </button>
        </div>

        <div id="courierOrdersList" class="space-y-4"></div>
    </main>

    <script>
        const SUPABASE_URL = "https://odrqwpcwcdfftjxatkyx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcnF3cGN3Y2RmZnRqeGF0a3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.Fvjz335UThZ0OfnwpdKCoO2Zg_WQA8jinFJnGV4CrB0";

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let orders = [];
        let courierTab = 'active';

        // تحديد اسم اللفرور بناءً على اسم الملف الحالي (livreur.html أو liv.html)
        const isLiv2 = window.location.pathname.includes('liv.html');
        const myCourierName = isLiv2 ? 'لفرور 2 (liv)' : 'لفرور 1 (livreur)';
        document.getElementById('pageTitle').textContent = `توصيل الطلبات - ${myCourierName}`;

        async function loadCourierData() {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    orders = data.payload.orders || [];
                }
            } catch (e) {}
            renderCourierOrders();
        }

        async function saveCourierData() {
            const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
            let currentPayload = data && data.payload ? data.payload : {};
            currentPayload.orders = orders;
            await sb.from('app_state').upsert({ id: 'simo_store_data', payload: currentPayload });
        }

        sb.channel('public:app_state_courier_realtime')
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state', filter: 'id=eq.simo_store_data' }, payload => {
              if (payload.new && payload.new.payload) {
                  orders = payload.new.payload.orders || [];
                  renderCourierOrders();
              }
          })
          .subscribe();

        loadCourierData();

        function switchCourierTab(tab) {
            courierTab = tab;
            document.getElementById('ctab-active').className = tab === 'active' ? 'flex-1 py-3 rounded-xl font-extrabold text-xs bg-indigo-600 text-white transition-smooth shadow-sm' : 'flex-1 py-3 rounded-xl font-extrabold text-xs bg-transparent text-slate-400 hover:text-white transition-smooth';
            document.getElementById('ctab-history').className = tab === 'history' ? 'flex-1 py-3 rounded-xl font-extrabold text-xs bg-indigo-600 text-white transition-smooth shadow-sm' : 'flex-1 py-3 rounded-xl font-extrabold text-xs bg-transparent text-slate-400 hover:text-white transition-smooth';
            renderCourierOrders();
        }

        async function updateOrderStatus(orderId, newStatus) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            order.status = newStatus;
            order.deliveredAt = Date.now();
            order.courierName = myCourierName;

            await saveCourierData();
            renderCourierOrders();
        }

        function renderCourierOrders() {
            const container = document.getElementById('courierOrdersList');
            if (!container) return;

            // تصفية الطلبات الخاصة بهذا اللفرور فقط
            let myAssignedOrders = orders.filter(o => o.courierAssigned === myCourierName);

            let filtered = [];
            if (courierTab === 'active') {
                filtered = myAssignedOrders.filter(o => o.status === 'pending' || o.status === 'scheduled');
            } else {
                filtered = myAssignedOrders.filter(o => o.status === 'delivered' || o.status === 'refused');
            }

            const todayStr = new Date().toDateString();
            const earnedToday = myAssignedOrders.filter(o => o.status === 'delivered' && o.deliveredAt && new Date(o.deliveredAt).toDateString() === todayStr)
                                                 .reduce((sum, o) => sum + Number(o.deliveryFee || 20), 0);
            document.getElementById('courierDailyEarn').textContent = earnedToday + ' د.م';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs font-semibold">لا توجد طلبات مسندة لك في هذا القسم حالياً</div>`;
                return;
            }

            container.innerHTML = filtered.map(order => `
                <div class="glass-panel p-5 rounded-3xl space-y-3.5 border border-slate-800">
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <span class="text-[11px] bg-indigo-500/20 text-indigo-300 font-bold px-3 py-1 rounded-xl">${order.productName}</span>
                            <p class="font-bold text-slate-200 text-xs mt-2.5 flex items-center gap-1.5">
                                <span class="text-rose-400">📍</span> ${order.address}
                            </p>
                        </div>
                        <span class="font-black text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-xl text-xs">${order.price} د.م</span>
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
                        <a href="tel:${order.phone}" class="font-bold text-indigo-400 hover:underline bg-indigo-500/10 px-3 py-1.5 rounded-xl" dir="ltr">📞 ${order.phone}</a>
                        <span class="text-slate-400 font-semibold">التوصيل: ${order.deliveryFee || 20} د.م</span>
                    </div>

                    ${courierTab === 'active' ? `
                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button onclick="updateOrderStatus('${order.id}', 'delivered')" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black py-3 rounded-xl text-xs transition-smooth flex items-center justify-center gap-1.5 shadow-md">
                            <i class="fa-solid fa-check"></i> تم الاستلام
                        </button>
                        <button onclick="updateOrderStatus('${order.id}', 'refused')" class="bg-rose-600 hover:bg-rose-500 text-white font-black py-3 rounded-xl text-xs transition-smooth flex items-center justify-center gap-1.5 shadow-md">
                            <i class="fa-solid fa-xmark"></i> رفض الاستلام
                        </button>
                    </div>` : `
                    <div class="text-center text-xs font-bold pt-2 text-${order.status === 'delivered' ? 'emerald' : 'rose'}-400">
                        ${order.status === 'delivered' ? '✅ تم تسليم الطلب بنجاح' : '❌ تم رفض الطلب'}
                    </div>`}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
